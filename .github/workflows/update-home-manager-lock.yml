name: Update Home Manager Lock

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}

on:
  workflow_dispatch:
  schedule:
    # 2h after "Update Flake Lock" (00:00 UTC) — gives its nixpkgs bump time
    # to auto-merge to main before we re-lock nixos-flake here, since our
    # nixpkgs comes from nixos-flake/nixpkgs (dot_config/home-manager/flake.nix)
    # rather than its own pin. Runs daily but the check_stale gate below
    # skips actually re-locking unless flake/flake.lock's nixpkgs moved, so
    # it doesn't PR on every unrelated commit to main.
    - cron: "0 2 * * *"

concurrency:
  group: update-home-manager-lock
  cancel-in-progress: true

jobs:
  update-home-manager-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure git authentication
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Attic Cache
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: https://cache.hydroakri.cc
          cache: cachix
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Setup LanTian Cache
        run: |
          printf '\nextra-substituters = https://attic.xuyh0120.win/lantian\nextra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=\n' >> ~/.config/nix/nix.conf

      - name: Check if upstream nixpkgs pin has moved
        id: check_stale
        run: |
          UPSTREAM_REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake/flake.lock)
          LOCKED_REV=$(jq -r '.nodes.nixpkgs.locked.rev' dot_config/home-manager/flake.lock)
          echo "flake/flake.lock 的 nixpkgs: $UPSTREAM_REV"
          echo "home-manager flake.lock 已鎖定的 nixpkgs: $LOCKED_REV"

          if [ "$UPSTREAM_REV" == "$LOCKED_REV" ]; then
            echo "nixpkgs 未變動，跳過本次更新。"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "偵測到上游 nixpkgs 變動，準備更新 home-manager lock。"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update lock and build activation package before PR
        if: steps.check_stale.outputs.should_update == 'true'
        env:
          USER: runner
        run: |
          cp dot_config/home-manager/flake.lock /tmp/hm_lock_before.json
          nix flake update --flake ./dot_config/home-manager

          CHANGED=$(git status --porcelain)
          echo "$CHANGED"
          if [ -n "$(echo "$CHANGED" | grep -v -E '^ M dot_config/home-manager/flake.lock$' || true)" ]; then
            echo "::error::unexpected working-tree changes after nix flake update, aborting"
            git checkout -- .
            exit 1
          fi

          echo "== build home-manager activation package =="
          cd dot_config/home-manager
          nix build ".#homeConfigurations.${USER}.activationPackage" \
            --accept-flake-config --print-build-logs --fallback --cores 2 --impure

      - name: Create update PR
        if: steps.check_stale.outputs.should_update == 'true'
        id: create_pr
        run: |
          BRANCH="bot/home-manager-update-$(date +%Y%m%d)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git push origin --delete "$BRANCH" 2>/dev/null || true

          jq -r '.nodes | to_entries[] | select(.value.locked) | [.key, .value.locked.rev] | @tsv' /tmp/hm_lock_before.json | sort > /tmp/lock_before.tsv
          jq -r '.nodes | to_entries[] | select(.value.locked) | [.key, .value.locked.rev] | @tsv' dot_config/home-manager/flake.lock | sort > /tmp/lock_after.tsv
          CHANGED_INPUTS=$(join /tmp/lock_before.tsv /tmp/lock_after.tsv | awk '$2 != $3 { printf "- %s %s -> %s\n", $1, substr($2,1,12), substr($3,1,12) }')

          git checkout -B "$BRANCH"
          git add dot_config/home-manager/flake.lock
          git commit -m "home-manager: nix flake update"
          git push -u origin "$BRANCH"

          BODY_FILE=$(mktemp)
          {
            echo 'Automated by `update-home-manager-lock` — the new lock already passed a build of the `runner` activation package in this workflow.'
            echo 'Merged only when CI is green; rolled back automatically on any failure.'
            echo
            echo '### Changed inputs'
            echo "${CHANGED_INPUTS:-none}"
          } > "$BODY_FILE"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "home-manager: nix flake update" \
            --body-file "$BODY_FILE" \
            --label automated --label dependencies)
          PR_NUM=$(basename "$PR_URL")
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Wait for CI, merge or roll back
        if: steps.create_pr.outputs.pr_number != ''
        env:
          PR_NUM: ${{ steps.create_pr.outputs.pr_number }}
          BRANCH: ${{ steps.create_pr.outputs.branch }}
        run: |
          set -e

          for i in $(seq 1 60); do
            N=$(gh pr view "$PR_NUM" --json statusCheckRollup -q '.statusCheckRollup | length' 2>/dev/null || echo 0)
            [ "$N" -gt 0 ] && break
            echo "waiting for CI to register on PR #$PR_NUM..."
            sleep 10
          done

          echo "== waiting for CI checks =="
          if timeout 21600 gh pr checks "$PR_NUM" --watch --interval 60; then
            echo "== all checks green, merging =="
            for attempt in 1 2 3; do
              if gh pr merge "$PR_NUM" --squash --delete-branch; then
                echo "merged #$PR_NUM"
                exit 0
              fi
              echo "merge attempt $attempt failed, retrying..."
              sleep 30
            done
            echo "::error::CI green but merge kept failing — PR left open for manual intervention"
            exit 1
          fi

          echo "::error::CI failed or timed out on #$PR_NUM — rolling back (main keeps the previous lock)"
          gh pr close "$PR_NUM" --comment "Dependency update CI failed — rolling back automatically; main keeps the previous flake.lock. Details in the Actions log of this run."
          git push origin --delete "$BRANCH" 2>/dev/null || true
          exit 1