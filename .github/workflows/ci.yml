name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - "flake/**"
      - "dot_config/home-manager/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "flake/**"
      - "dot_config/home-manager/**"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "37 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Flake Check
        working-directory: ./flake
        run: nix flake check --accept-flake-config

  nix-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Generate Matrix from Flake
        id: set-matrix
        working-directory: ./flake
        run: |
          matrix="$(nix eval --json --accept-flake-config '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, nix-matrix]
    name: ${{ matrix.name }} (${{ matrix.system }})

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Free Disk Space
        run: |
          # 手动清理 GitHub Runner 预装的大型软件，腾出空间（clang/llvm 源码构建对磁盘和内存都吃紧）
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Add swap
        run: |
          # runner 自带 /swapfile 已激活，fallocate 会因 Text file busy 失败，用独立文件名叠加
          sudo fallocate -l 8G /extra-swapfile
          sudo chmod 600 /extra-swapfile
          sudo mkswap /extra-swapfile
          sudo swapon /extra-swapfile

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Setup Attic Cache
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          endpoint: https://cache.hydroakri.cc
          cache: cachix
          token: ${{ secrets.ATTIC_TOKEN }}
          # cache.hydroakri.cc is only reachable through a Cloudflare Tunnel (oci.nix), and any
          # hostname routed through Cloudflare's edge is capped at ~100MB/request on Free/Pro
          # plans — enforced at the edge itself, confirmed by nginx's own client_max_body_size
          # being 0 (unlimited) yet still 413ing, and by the error page being Cloudflare's, not
          # nginx's. Skip the action's own push and filter by actual NAR size instead (below),
          # so this doesn't need updating whenever a new oversized package shows up.
          skip-push: true

      - name: Setup LanTian Cache
        run: |
          printf '\nextra-substituters = https://attic.xuyh0120.win/lantian\nextra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=\n' >> ~/.config/nix/nix.conf

      - name: Build System (${{ matrix.name }})
        working-directory: ./flake
        run: |
          nix config show | grep -E "substituters|trusted-public-keys"
          nix build '.#${{ matrix.attr }}' \
            --accept-flake-config \
            --print-build-logs \
            --fallback \
            --cores 2

      - name: Push to Attic
        if: always()
        run: |
          # Cloudflare's edge (see Setup Attic Cache step) rejects any single request over
          # ~100MB regardless of plan headroom, so stay comfortably under it. --json-format 2
          # is required: upstream Nix's plain --json for --all is a deprecated object-keyed
          # format with no .path field, not an array (mirrors ryanccn/attic-action's own parsing).
          THRESHOLD=$((95 * 1000 * 1000))
          nix path-info --all --json --json-format 2 \
            | jq -r --argjson max "$THRESHOLD" '
                .storeDir as $sd | .info
                | to_entries[] | select(.value.narSize >= $max)
                | "  skip \($sd)/\(.key) (\(.value.narSize / 1e6 | floor)MB)"
              '
          nix path-info --all --json --json-format 2 \
            | jq -r --argjson max "$THRESHOLD" '
                .storeDir as $sd | .info
                | to_entries[] | select(.value.narSize < $max)
                | "\($sd)/\(.key)"
              ' \
            | attic push -j 2 --stdin cachix && echo "attic push OK" || echo "::warning::attic push had non-fatal errors, see log above"

  home-manager-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Setup Attic Cache
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          endpoint: https://cache.hydroakri.cc
          cache: cachix
          token: ${{ secrets.ATTIC_TOKEN }}
          # See the build job's Setup Attic Cache step for why: Cloudflare edge request-size
          # cap, not an origin/nginx limit.
          skip-push: true

      - name: Setup LanTian Cache
        run: |
          printf '\nextra-substituters = https://attic.xuyh0120.win/lantian\nextra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=\n' >> ~/.config/nix/nix.conf

      - name: Build Home Manager activation package
        working-directory: ./dot_config/home-manager
        run: |
          nix build ".#homeConfigurations.${USER}.activationPackage" \
            --accept-flake-config \
            --print-build-logs \
            --fallback \
            --impure
        env:
          USER: runner

      - name: Push to Attic
        if: always()
        run: |
          THRESHOLD=$((95 * 1000 * 1000))
          nix path-info --all --json --json-format 2 \
            | jq -r --argjson max "$THRESHOLD" '
                .storeDir as $sd | .info
                | to_entries[] | select(.value.narSize >= $max)
                | "  skip \($sd)/\(.key) (\(.value.narSize / 1e6 | floor)MB)"
              '
          nix path-info --all --json --json-format 2 \
            | jq -r --argjson max "$THRESHOLD" '
                .storeDir as $sd | .info
                | to_entries[] | select(.value.narSize < $max)
                | "\($sd)/\(.key)"
              ' \
            | attic push -j 2 --stdin cachix && echo "attic push OK" || echo "::warning::attic push had non-fatal errors, see log above"
