  - &omen15 age1lytsw063jquk2snp8sujz4klx389ajs424y4enuqelnhmu4sas6scccvmr
  - &rpi4 age1rdsf9knqawl06a8tgzhn24g5ueeggxzge0ejz6h362pnfp55v93qeackm3
  - &oci age1ce5plln3w2ptsah5393gzzkhjwq8mudejd3e6exwzlrcdtsrd9nsqq2p2z
  - &nitrokey age1fido2-

creation_rules:
  - path_regex: proxy-secrets.yaml$
    key_groups:
      - age:
          - *hydroakri-new
          - *omen15
          - *rpi4
          - *nitrokey
  - path_regex: secrets.yaml$
