name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - "flake/**"
      - "dot_config/home-manager/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "flake/**"
      - "dot_config/home-manager/**"
      - ".github/workflows/ci.yml"
  schedule:
    # Catches breakage from upstream nixpkgs drift even without a push here.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Flake Check
        working-directory: ./flake
        run: nix flake check --accept-flake-config

  nix-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Generate Matrix from Flake
        id: set-matrix
        working-directory: ./flake
        run: |
          matrix="$(nix eval --json --accept-flake-config '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, nix-matrix]
    name: ${{ matrix.name }} (${{ matrix.system }})

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Free Disk Space
        run: |
          # 手动清理 GitHub Runner 预装的大型软件，腾出空间（clang/llvm 源码构建对磁盘和内存都吃紧）
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Add swap
        run: |
          # runner 自带 /swapfile 已激活，fallocate 会因 Text file busy 失败，用独立文件名叠加
          sudo fallocate -l 8G /extra-swapfile
          sudo chmod 600 /extra-swapfile
          sudo mkswap /extra-swapfile
          sudo swapon /extra-swapfile

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Setup Attic Cache
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: https://cache.hydroakri.cc
          cache: cachix
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Setup LanTian Cache
        run: |
          printf '\nextra-substituters = https://attic.xuyh0120.win/lantian\nextra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=\n' >> ~/.config/nix/nix.conf

      - name: Build System (${{ matrix.name }})
        working-directory: ./flake
        run: |
          nix config show | grep -E "substituters|trusted-public-keys"
          nix build '.#${{ matrix.attr }}' \
            --accept-flake-config \
            --print-build-logs \
            --fallback \
            --cores 2

  home-manager-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Setup Attic Cache
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: https://cache.hydroakri.cc
          cache: cachix
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Setup LanTian Cache
        run: |
          printf '\nextra-substituters = https://attic.xuyh0120.win/lantian\nextra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=\n' >> ~/.config/nix/nix.conf

      - name: Build Home Manager activation package
        working-directory: ./dot_config/home-manager
        run: |
          nix build ".#homeConfigurations.${USER}.activationPackage" \
            --accept-flake-config \
            --print-build-logs \
            --fallback \
            --impure
        env:
          USER: runner
